version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: webscraper-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=webscraper
    volumes:
      - mongodb_data:/data/db

  # Node.js Express Backend Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: webscraper-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/webscraper
    depends_on:
      - mongodb

volumes:
  mongodb_data:
    driver: local
